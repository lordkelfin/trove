<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f7eedb;font-family:system-ui,sans-serif;color:#3a2a1c}
iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:transparent}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#msg a{color:#2f62b8;font-weight:700;font-size:18px}
</style></head><body>
<div id="msg">Loading Trove…</div>
<script>
/* Opens the newest game file in this folder, whatever it's called (trove_V1.html, trove_V2.html, …).
   GitHub Pages can't list a folder, so it asks GitHub's public API which .html files the repository has. */
(function(){
  const msg=document.getElementById('msg'),here=location.pathname.split('/').pop()||'index.html';
  const natural=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
  /* the game fills the whole screen; it gets the phone's safe-area sizes from here and tells us its background colour */
  const probe=document.createElement('div');probe.id='safe';document.body.appendChild(probe);
  function sendSafe(f){const c=getComputedStyle(probe),S={t:parseFloat(c.paddingTop)||0,r:parseFloat(c.paddingRight)||0,b:parseFloat(c.paddingBottom)||0,l:parseFloat(c.paddingLeft)||0};try{f.contentWindow.postMessage({troveSafe:S},'*')}catch(e){}}
  addEventListener('message',e=>{const bg=e.data&&e.data.troveBg;if(!bg)return;document.documentElement.style.background=document.body.style.background=bg;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=bg});
  function open(file){try{localStorage.setItem('trove-launch',file)}catch(e){}
    const f=document.createElement('iframe');f.src=file;f.allow='fullscreen';f.title='Trove';document.body.appendChild(f);msg.remove();
    const go=()=>sendSafe(f);f.addEventListener('load',()=>{go();setTimeout(go,300)});addEventListener('resize',()=>setTimeout(go,60));addEventListener('orientationchange',()=>setTimeout(go,300))}
  function fail(list){let last=null;try{last=localStorage.getItem('trove-launch')}catch(e){}
    if(last){open(last);return}
    msg.innerHTML=list&&list.length?'Pick a version:'+list.map(f=>'<a href="'+f+'">'+f+'</a>').join(''):'Couldn\'t find the game file. Open it directly, e.g. <a href="trove_V1.html">trove_V1.html</a>'}
  /* which repository and folder this page lives in: project sites are owner.github.io/repo/…, user sites are owner.github.io/… */
  function candidates(host,pathname){const m=host.match(/^([^.]+)\.github\.io$/i);if(!m)return[];
    const segs=pathname.split('/').filter(Boolean);if(segs.length&&/\.html?$/i.test(segs[segs.length-1]))segs.pop();
    const out=[];if(segs.length)out.push({owner:m[1],repo:segs[0],dir:segs.slice(1).join('/')});out.push({owner:m[1],repo:host.toLowerCase(),dir:segs.join('/')});return out}
  window.__candidates=candidates;
  const tries=candidates(location.hostname,location.pathname);if(!tries.length){fail();return}
  (function next(k){if(k>=tries.length){fail();return}const t=tries[k];
    fetch('https://api.github.com/repos/'+t.owner+'/'+t.repo+'/contents/'+t.dir)
      .then(r=>r.ok?r.json():Promise.reject())
      .then(items=>{const html=items.filter(i=>i.type==='file'&&/\.html?$/i.test(i.name)&&!/^index\.html?$/i.test(i.name)&&i.name!==here).map(i=>i.name).sort(natural);
        if(!html.length){fail();return}open(html[html.length-1])})
      .catch(()=>next(k+1))})(0)})();
</script>
