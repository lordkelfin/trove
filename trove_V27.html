<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg1:#3c5a40;--bg2:#17251b;--card:#f7eedb;--card2:#fffaf0;--line:#e2d2b0;--ink:#3a2a1c;--mute:#7b6a55;--acc:#2f7a3a;--acc2:#3f9a4a;--gold:#c88a12;--blue:#2f62b8;--shadow:0 18px 50px #0007,0 2px 0 #fff8 inset;
  --fh:'Fraunces',Georgia,serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:var(--fb);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:var(--fb)}
kbd{background:#ece0c6;color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:700 .82em var(--fb)}
#app{position:relative;margin:16px auto;width:max-content;max-width:98vw;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid #fff6;border-radius:22px;padding:16px 20px 18px;box-shadow:var(--shadow);touch-action:none}
#app h2{margin:0;font:700 24px var(--fh);letter-spacing:.2px}
#app h2.title{font-size:34px;letter-spacing:.5px;background:linear-gradient(90deg,#3a2a1c,#7a4a12);-webkit-background-clip:text;background-clip:text;color:transparent}
/* buttons */
#app button{font:700 15px var(--fb);color:var(--ink);background:#efe3c8;border:1px solid #d9c59c;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 0 #c9b48a,0 4px 10px #0001;transition:transform .08s,box-shadow .08s,background .15s}
#app button:hover:not(:disabled){background:#f6ecd4}
#app button:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 #c9b48a}
#app button:disabled{opacity:.45;cursor:default;box-shadow:none}
#app button.pri{background:linear-gradient(180deg,#4caf58,#2f8a3c);color:#fff;border-color:#2a7a36;box-shadow:0 3px 0 #1f6a2c,0 6px 14px #2f7a3a55}
#app button.pri:hover:not(:disabled){background:linear-gradient(180deg,#58bb64,#349544)}
#app button.icon{width:40px;height:40px;padding:0;border-radius:50%;font-size:18px;display:grid;place-items:center}
#app button.ghostb{background:transparent;box-shadow:none;border-color:#d9c59c;color:var(--mute)}
#app button.ghostb:hover{background:#0000000a;color:var(--ink)}
/* header */
.phead{display:flex;gap:14px;align-items:center;margin-bottom:10px;min-height:40px}
.phead .sp2{margin-left:auto}
.lvl{font:600 16px var(--fb);color:var(--mute);background:#0000000a;border-radius:999px;padding:4px 12px}.lvl b{font:800 20px var(--fb);color:var(--ink)}
.stopn{font:600 14px var(--fb);color:var(--mute)}.stopn::before{content:'🏅 '}
.prac{font:800 13px var(--fb);color:#fff;background:#8a5fc0;border-radius:999px;padding:4px 11px}
/* grids area */
.grids{display:flex;gap:8px;align-items:flex-start}
.glabel{text-align:center;font:800 13px var(--fb);letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.glabel small{font-weight:700;opacity:.8;text-transform:none;letter-spacing:0}
.demo .glabel{color:var(--blue);text-transform:none;letter-spacing:0;font-size:14px}.demo.mine .glabel{color:var(--acc)}.demo .grid{border-style:dashed}
/* side panel */
.side{display:flex;flex-direction:column;gap:8px;width:172px;padding-top:24px;margin-left:6px}
.act{width:100%;padding:12px 10px!important;line-height:1.25}
.act.go{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#4caf58,#2f8a3c)!important;color:#fff!important;border-color:#2a7a36!important;box-shadow:0 4px 0 #1f6a2c,0 8px 18px #2f7a3a55!important}
.act.go span{font:700 12px var(--fb);opacity:.9;letter-spacing:.5px;text-transform:uppercase}.act.go b{font:800 23px var(--fb)}
.act.go:hover:not(:disabled){background:linear-gradient(180deg,#58bb64,#349544)!important}
.act.go:active:not(:disabled){box-shadow:0 0 0 #1f6a2c!important}
.act.peekb{background:#e4ecf8!important;border-color:#bccbe6!important;box-shadow:0 2px 0 #b2c2df!important;color:#23457e!important}
.hint{font-size:14px;line-height:1.45;background:#fffaf0;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px #0000000d}
.hint small{font-size:12.5px;color:var(--mute)}.hint.think{color:var(--blue);font-style:italic}
.bot{font:600 12.5px var(--fb);color:var(--mute);line-height:1.35}
.chlist{margin-top:6px;font-size:15px}
/* info */
#info{width:0;min-width:100%;margin-top:12px;height:84px;overflow:hidden;background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:4px 16px;font:500 16px var(--fb);box-shadow:0 2px 10px #0000000f inset}
#info .top{height:38px;line-height:38px;white-space:nowrap;overflow:hidden}
#info .top b{font-weight:800}
#info .calc{height:38px;line-height:38px;white-space:nowrap;overflow:hidden;font:700 14px var(--fb);color:#6a5a44;font-variant-numeric:tabular-nums}
#info .nts{margin-left:44px;display:inline-flex;gap:14px;align-items:center;vertical-align:middle;line-height:20px}
#info .tip{color:var(--mute);font-weight:600;font-size:14.5px}
/* timer */
.tbar{position:relative;height:16px;margin:0 0 12px;background:#0000000f;border-radius:999px;overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#3f9a4a,#6cc178);transition:background .3s}
.tbar i.mid{background:linear-gradient(90deg,#d99a12,#f2c04a)}.tbar i.low{background:linear-gradient(90deg,#c8402e,#ef6a52)}
.tbar span{position:absolute;right:10px;top:0;line-height:16px;font:800 11px var(--fb);color:var(--ink)}
/* menu */
.lead{max-width:600px;font-size:16.5px;line-height:1.55;color:#5a4a36;margin:4px 0 16px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(240px,300px));gap:14px}
.mode{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px 18px 16px;border-radius:18px;background:linear-gradient(160deg,#eaf1fb,#dbe6f6);border:1px solid #c4d3ec;cursor:pointer;box-shadow:0 3px 0 #b8c8e4,0 10px 24px #2f62b81f;transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translateY(-2px);box-shadow:0 5px 0 #b8c8e4,0 16px 30px #2f62b82a}
.mode:active{transform:translateY(1px);box-shadow:0 1px 0 #b8c8e4}
.mode.cont{grid-column:1/-1;background:linear-gradient(160deg,#e6f3e2,#d3ebcc);border-color:#a9d39c;box-shadow:0 3px 0 #9cc88e,0 10px 24px #2f7a3a1f}
.dark .mode.cont{background:linear-gradient(160deg,#1f3322,#18281b);border-color:#3c6a40;box-shadow:0 3px 0 #0f1a10,0 10px 24px #0005}
.mode.timed{background:linear-gradient(160deg,#fcf0df,#f7e1c4);border-color:#ecc999;box-shadow:0 3px 0 #e2bd8a,0 10px 24px #c0702f1f}
.mode.timed:hover{box-shadow:0 5px 0 #e2bd8a,0 16px 30px #c0702f2a}
.mode *{pointer-events:none}
.mode .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:#fff9;margin-bottom:6px;box-shadow:0 2px 6px #0001}
.mode b{font:700 22px var(--fh)}.mode span{font-size:14px;color:#5a4a36;line-height:1.4}.mode .ms{margin-top:6px;font-weight:700;color:var(--mute)}
/* modals */
.modal{position:absolute;inset:0;background:#1a120c66;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:22px;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.mbox{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid #fff8;border-radius:22px;padding:22px 28px;text-align:center;min-width:320px;max-width:520px;box-shadow:0 20px 60px #0008;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mbox h2{margin-bottom:6px!important}.mbox p{font-size:16px;margin:8px 0;color:#5a4a36}
.mbox .kick{font:800 13px var(--fb);letter-spacing:1.5px;text-transform:uppercase;color:#b0412e;margin:0}
.mbox .score{font:700 64px var(--fh);margin:0;line-height:1.1;color:var(--ink)}
.mbox .nb{color:var(--gold)}
.mbox button{margin:5px 4px}.mrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.mbox.set{text-align:left;max-width:460px}.mbox.set h2{margin-bottom:10px!important}
.tog{display:flex;gap:14px;align-items:flex-start;margin:14px 0 18px;cursor:pointer}.tog *{pointer-events:none}
.tog small{font-size:13.5px;color:var(--mute);line-height:1.45}.tog b{font-size:16px}
.sw{flex:none;width:44px;height:26px;border-radius:999px;background:#d8cbb0;position:relative;transition:background .2s;margin-top:1px}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:left .2s}
.sw.on{background:var(--acc2)}.sw.on::after{left:21px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#2a1c12ee;color:#f7eedb;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;font:700 15px var(--fb);z-index:30;box-shadow:0 8px 24px #0006}
#cheer .msg{font-family:var(--fh)!important}
#rotate{display:none}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* compact: phones in landscape, small windows */
@media (max-height:560px),(max-width:900px){
  #app{margin:6px auto;padding:8px 12px 10px;border-radius:16px}
  .phead{gap:10px;margin-bottom:6px;min-height:32px}#app h2{font-size:18px}#app h2.title{font-size:24px}
  #app button{font-size:13px;padding:6px 10px;border-radius:10px}#app button.icon{width:32px;height:32px;font-size:15px}
  .lvl{font-size:13px;padding:2px 10px}.lvl b{font-size:16px}.stopn{font-size:12px}
  .grids{gap:5px}.glabel{font-size:11px;margin-bottom:3px}
  .side{width:128px;gap:6px;padding-top:18px;margin-left:4px}.act{padding:8px 6px!important}.act.go b{font-size:20px}.act.go span{font-size:11px}
  .hint{font-size:12.5px;padding:7px 9px}.bot{font-size:11px}
  #info{height:58px;margin-top:6px;padding:2px 12px;font-size:13.5px;border-radius:12px}
  #info .top,#info .calc{height:27px;line-height:27px}#info .calc{font-size:12px}#info .tip{font-size:12.5px}
  .tbar{height:13px;margin-bottom:6px}.tbar span{line-height:13px;font-size:9.5px}
  .lead{font-size:14px;margin:2px 0 10px}.modes{grid-template-columns:repeat(2,minmax(200px,280px));gap:10px}
  .mode{padding:12px 14px}.mode .mi{width:36px;height:36px;font-size:20px}.mode b{font-size:18px}.mode span{font-size:12.5px}
  .mbox{padding:14px 18px;min-width:280px}.mbox .score{font-size:44px}.mbox p{font-size:14px;margin:5px 0}
  #cheer .msg{font-size:30px!important}
}
/* phones and tablets: the game fills the whole screen */
@media (pointer:coarse){
  html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--card)!important}
  html:has(body.dark),body.dark{background:#221d18!important}
  body{display:block;min-height:100vh;min-height:100dvh}
  #app{margin:0;width:100%;max-width:none;min-height:100dvh;border:0;border-radius:0;box-shadow:none;background:var(--card);
    display:flex;flex-direction:column;align-items:center;
    padding:max(8px,var(--sat,env(safe-area-inset-top))) max(12px,var(--sar,env(safe-area-inset-right))) max(8px,var(--sab,env(safe-area-inset-bottom))) max(12px,var(--sal,env(safe-area-inset-left)))}
  .phead,.tbar,.infow{align-self:stretch}
  .modal{border-radius:0;position:fixed}
}
/* save / load layout */
.savb{background:#efe3c8}.savrow{display:flex;gap:6px}.savrow .act{padding:8px 6px!important}.savrow .sm{flex:0 0 38%;font-size:13px!important}.savrow .act b{font-size:16px}
/* feedback loops */
.lp{position:absolute;font-size:14px;line-height:1;background:#fff;border-radius:50%;padding:1px 2px;box-shadow:0 0 0 2px #8a3fc0;animation:spinlp 2.4s linear infinite;z-index:2}
@keyframes spinlp{to{transform:rotate(360deg)}}
#info .loopt{color:#8a3fc0;font-weight:700}.dark #info .loopt{color:#c79af0}
/* bigger info text on touch screens */
@media (pointer:coarse){#info{height:66px;font-size:15.5px}#info .top,#info .calc{height:31px;line-height:31px}#info .calc{font-size:13.5px}#info .tip{font-size:14px}}

/* exact search: tries every arrangement (practical up to ~6 pieces). onBetter(best,layout) is called on each improvement */
function exactSolve(items,onBetter){const n=items.length,C=items.map(i=>cands(i,5,4)),abs=items.some(i=>{const d=DEF[i.d];return d.heavy||d.k==='corner'||d.k==='enclosed'});
  const twin=items.map((it,i)=>{for(let j=i-1;j>=0;j--)if(items[j].d===it.d&&items[j].dir===it.dir&&items[j].base===it.base)return j;return -1});
  const idx=new Int32Array(n).fill(-1),g={cols:5,rows:4,items:[]},its=items.map(i=>Object.assign({},i));let best=-1;

      g.items.length=0;for(let i=0;i<n;i++)if(idx[i]>=0){const p=C[i][idx[i]];its[i].x=p.x;its[i].y=p.y;its[i].rot=p.rot;g.items.push(its[i])}
      const v=evalPack(g).total;if(v>best){best=v;onBetter&&onBetter(v,g.items.map(i=>Object.assign({},i)))}return}
    const tw=twin[k],lo=tw>=0?idx[tw]:-2;

/* levels where no piece can change any value: plain treasures, arrow turners, Echo Conch and Lead Seal.

  const C=items.map(it=>cands(Object.assign({},it,{rot:0}),5,4)),A=C.map(c=>c.length?c[0].cells.length:99);
  const byCell=[...Array(20)].map(()=>[]);items.forEach((it,i)=>C[i].forEach(p=>{byCell[Math.min(...p.cells)].push([i,p])}));
  const first=items.map((it,i)=>{for(let j=0;j<i;j++)if(items[j].d===it.d&&items[j].base===it.base)return j;return i});
  let nodes=0,stop=false;

  const fits=mask=>{let area=0;for(let i=0;i<n;i++)if(mask>>i&1)area+=A[i];if(area>20)return null;
    const occ=new Uint8Array(20),used=new Uint8Array(n),pick=new Array(n).fill(null);let left=0;for(let i=0;i<n;i++)if(mask>>i&1)left++;
    const rec=(c,spare)=>{if(++nodes>limit){stop=true;return false}if(!left)return true;while(c<20&&occ[c])c++;if(c>=20)return false;
      for(const[i,p]of byCell[c]){if(!(mask>>i&1)||used[i])continue;const f=first[i];if(f!==i&&(mask>>f&1)&&!used[f])continue;
        let ok=true;for(const q of p.cells)if(occ[q]){ok=false;break}if(!ok)continue;
        used[i]=1;pick[i]=p;left--;for(const q of p.cells)occ[q]=1;if(rec(c+1,spare))return true;if(stop)return false;for(const q of p.cells)occ[q]=0;left++;used[i]=0;pick[i]=null}
      if(spare>0){occ[c]=2;if(rec(c+1,spare-1))return true;occ[c]=0}return false};
    return rec(0,20-area)?pick:null};
  /* small sets that can't fit together (e.g. two heavy pieces fighting over the bottom row) rule out every set containing them */
  const bad=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const m=(1<<i)|(1<<j);if(!fits(m)){if(stop)return null;bad.push(m)}}
  const heavy=items.reduce((m,it,i)=>DEF[it.d].heavy?m|(1<<i):m,0);
  /* try sets from most to least valuable; the first that fits is the best possible sale */
  const sets=[];for(let m=1;m<1<<n;m++){if(bad.some(b=>(m&b)===b))continue;let v=0,a=0;for(let i=0;i<n;i++)if(m>>i&1){v+=B[i];a+=A[i]}if(a<=20)sets.push([v,m])}
  sets.sort((x,y)=>y[0]-x[0]);const noH=new Set();
  for(const[v,m]of sets){const h=m&heavy;if(h&&(h&(h-1))){if(noH.has(h))continue;if(!fits(h)){if(stop)return null;noH.add(h);continue}}
    const p=fits(m);if(stop)return null;if(p){const layout=[];for(let i=0;i<n;i++)if(p[i])layout.push(Object.assign({},items[i],{x:p[i].x,y:p[i].y,rot:p[i].rot}));return{best:v,layout}}}
  return{best:0,layout:[]}}

function refine(id,items,base,n){if(cur!==id)return;
  /* nothing on this level can change any value: just find the most valuable set that fits, and that's certain */
  if(n===0&&isNeutralLevel(items)){const P=packBest(items);if(P){if(P.best>base)postMessage({id,best:P.best,layout:P.layout});postMessage({id,done:true,certain:true});return}}if(n>=40){postMessage({id,done:true});return}
  postMessage({id,prog:n/40});const r=solve(items,{iters:20000,restarts:3});if(cur!==id)return;if(r.best>base){base=r.best;postMessage({id,best:r.best,layout:r.layout})}
  setTimeout(()=>refine(id,items,base,n+1),0)}

  if(m.type==='solve'){const r=solve(m.items,m.opts||{iters:20000,restarts:8});postMessage({id:m.id,best:r.best,layout:r.layout})}
  else if(m.type==='refine'){cur=m.id;setTimeout(()=>refine(m.id,m.items,m.base,0),0)}
  else if(m.type==='stop')cur=0};
</script>

<script>'use strict';
/* routes, cargo per stop */
const STOPS=5;
/* f = share of the bot's perfect earnings (stops 1-4) that the fuel costs */
const TIERS=[{name:'Easy',f:.62,xp:0},{name:'Medium',f:.78,xp:250},{name:'Hard',f:.9,xp:800}];
function makeCosts(bests,f,r){const B=[];let acc=0;for(let k=0;k<STOPS-1;k++){acc+=bests[k];B.push(acc)}
  const T=f*B[STOPS-2],w=[.17,.22,.28,.33].map(x=>x*(.85+r()*.3)),ws=w.reduce((a,b)=>a+b);
  const c=w.map(x=>Math.max(10,Math.round(T*x/ws/5)*5));
  // perfect play must always cover the fuel: push any excess on a leg to later legs
  let C=0;for(let k=0;k<c.length;k++){C+=c[k];const over=C-B[k];if(over>0){const cut=Math.ceil(over/5)*5;c[k]-=cut;C-=cut;if(k+1<c.length)c[k+1]+=cut}}
  return[0].concat(c)}
const STAGE_W=6,STAGE_H=4;
function pick(r,depth,want){for(let k=0;k<40;k++){const it=rollItem(r,depth,0),t=DEF[it.d].k==='none';if(want===null||t===want)return it}return rollItem(r,depth,0)}
/* Endless adds pieces as levels climb (5 always possible, max 12) */
function cargoSize(r,stop,endless){if(!endless)return 5+(r()<.5?1:0);const p=Math.min(.85,(stop+1)*.04);let n=5;while(n<12&&r()<p)n++;return n}
const curbRows=n=>n<=7?4:n<=10?5:6;
function cargo(seed,tier,stop,endless){const r=mulberry(Math.imul(seed,2654435761)^(stop*40503+tier*977+1)),depth=tier*1.2+stop*.7,n=cargoSize(r,stop,endless),items=[];
  // usual mix: 2 plain treasures, 2 effect pieces, the rest anything. 5% of the time the whole cargo is one kind
  const mono=r()<.05?(r()<.5?'plain':'effect'):null;
  for(let i=0;i<n;i++)items.push(pick(r,depth,mono?mono==='plain':i<2?true:i<4?false:null));
  items.forEach((it,i)=>{it.uid=stop*100+i;const d=DEF[it.d];if(d.k==='grow'||d.k==='growx')it.lvl=stop+1;if(d.k==='grow')it.base+=d.g*stop;else if(d.k==='growx')it.base=Math.min(250,it.base*Math.pow(2,stop+1))});
  const g={cols:STAGE_W,rows:endless?curbRows(n):STAGE_H,items:[]};for(const it of items){it.rot=DEF[it.d].big?(r()*4|0):0;let sp=findSpot(g,it);while(!sp&&endless&&g.rows<9){g.rows++;sp=findSpot(g,it)}if(sp){Object.assign(it,sp);g.items.push(it)}}
  if(endless&&g.items.length){const top=Math.min(...g.items.map(i=>i.y+Math.min(...geom(i).cells.map(c=>c[1])))),lift=Math.max(0,Math.min(top,g.rows-curbRows(n)));for(const i of g.items)i.y-=lift}
  return g.items}
if(typeof module!=='undefined')module.exports={STOPS,TIERS,makeCosts,cargo,cargoSize,curbRows,STAGE_W,STAGE_H};
</script>

/* a piece's tile: one outline around all its squares, rounded at every corner (inside corners too), one gradient */
let shpN=0;
function shapeSVG(cells,CS,bg,ink){const key=new Set(cells.map(c=>c[0]+','+c[1])),has=(x,y)=>key.has(x+','+y),E=new Map();

  const loops=[],used=new Set();

    const v=[];for(let i=0;i<pts.length;i++){const a=pts[(i-1+pts.length)%pts.length],b=pts[i],c=pts[(i+1)%pts.length];if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])!==0)v.push(b)}loops.push(v)}
  const d=3,r=Math.max(3,Math.min(8,CS*.12));let path='';

    for(let i=0;i<n;i++){const q=P[i],rIn=Math.min(r,L((i-1+n)%n)/2),rOut=Math.min(r,L(i)/2);A.push([q.p[0]-q.di[0]*rIn,q.p[1]-q.di[1]*rIn]);B.push([q.p[0]+q.dout[0]*rOut,q.p[1]+q.dout[1]*rOut])}

function itemHTML(it,s,CS,pos,compact){const d=DEF[it.d],ge=geom(it),cells=ge.cells,has=(x,y)=>cells.some(c=>c[0]===x&&c[1]===y),ed=s?s.def:d;

function gridHTML(name,label){const g=UI.grids[name],CS=csFor(name),ev=name==='pack'?UI.ev:name==='demo'?UI.dev:null;let c='',m='',p='',it='';

  if(ev)for(const s of ev.S){if(s.sil||!s.def.arrow)continue;const col=FAMC[fam(s.def)],lab=pillOf(s);

function placeGroup(g,h,nx,ny,keep){const added=[];let ok=true;for(const q of h.items){q.it.x=nx+q.dx;q.it.y=ny+q.dy;if(fits(g,q.it,q.it.x,q.it.y)){g.items.push(q.it);added.push(q.it)}else{ok=false;break}}

function numHTML(d,s){const N=s?s.N:d.n,np=s&&s.Np;if(!np||!np.a.length&&!np.m.length)return fm(N||0);
  const sg=v=>(v<0?'−':'+')+fm(Math.abs(v));let h='<span class="nexp">';h+=np.a.length?'('+fm(d.n)+np.a.map(a=>NT(a.i,sg(a.v))).join('')+')':fm(d.n);h+=np.m.map(m=>NT(m.i,'×'+fm(m.v))).join('');return h+'</span>'}
function infoHTML(it,s){const d=s?s.def:DEF[it.d],N=s?s.N:d.n,od=DEF[it.d];

function applause(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate,buf=AC.createBuffer(1,sr*.08,sr),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);

function selectInPlace(fn){const before=UI.held;fn();if(UI.held&&UI.held!==before){UI.held.inPlace=true;render()}}
function tapPlace(c,f){const h=UI.held,nx=c.cx-h.gx,ny=c.cy-h.gy;
  if(placeGroup(c.g,h,nx,ny,true)){UI.held=null;sfx(500,.05);render();return true}
  /* tapping another piece only moves the selection to it; swapping is for dragging */
  if(occ(c.g)[c.cy*c.g.cols+c.cx]){dropHeld();render();selectInPlace(()=>onDown(f));return true}
  sfx(140,.06,'square');return true}
function tap(f){const now=performance.now(),c=cellAt(f);
  if(UI.peek!=null){const g=c&&c.g,it=g&&occ(g)[c.cy*g.cols+c.cx];
    if(it&&it!==UI.peekSel){UI.peekSel=it;hover(f)}else{UI.peekSel=null;hideHl();const info=$('info');if(info)info.innerHTML=idleText()}return}
  if(PORTRAIT&&lastTap&&lastTap.tray&&now-lastTap.t<330&&Math.hypot(f.clientX-lastTap.x,f.clientY-lastTap.y)<24){lastTap=null;
    const h=UI.held;if(h&&h.from==='curb'&&h.items.length===1&&DEF[h.items[0].it.d].big){rotateHeld();heldToTray();sfx(600,.05);render()}return}
  if(PORTRAIT&&(trayTile(f)||onTray(f))){lastTap={t:now,tray:true,x:f.clientX,y:f.clientY};selectInPlace(()=>onDown(f));return}
  if(UI.held&&UI.held.inPlace&&UI.peek==null){
    if(c&&lastTap&&now-lastTap.t<330&&lastTap.c&&lastTap.c.name===c.name&&lastTap.c.cx===c.cx&&lastTap.c.cy===c.cy){lastTap=null;doubleTap(c,f);return}
    lastTap={t:now,c};if(c&&c.name!=='demo'){tapPlace(c,f);return}dropHeld();render();return}
  if(c&&lastTap&&now-lastTap.t<330&&lastTap.c&&lastTap.c.name===c.name&&lastTap.c.cx===c.cx&&lastTap.c.cy===c.cy){lastTap=null;doubleTap(c,f);return}
  lastTap={t:now,c};
  const under=c&&occ(c.g)[c.cy*c.g.cols+c.cx];
  if(c&&c.name==='pack'&&UI.sel.size&&!UI.held&&under&&!UI.sel.has(under)){if(UI.selMoved){UI.sel.clear();UI.selMoved=false;render()}else onDown(fakeEv(f.clientX,f.clientY,true));return}
  /* among the level's pieces, tapping another piece while holding one puts the held one back and picks up the new one (no swap) */
  if(c&&c.name==='curb'&&UI.held&&occ(c.g)[c.cy*c.g.cols+c.cx]){dropHeld();render();selectInPlace(()=>onDown(fakeEv(f.clientX,f.clientY)));return}
  selectInPlace(()=>onDown(f))}
document.addEventListener('touchstart',e=>{lastTouchT=performance.now();if(e.touches.length>1||UI.mode!=='run'||!run)return;const p=e.touches[0],el=document.elementFromPoint(p.clientX,p.clientY);
  if(UI.peek!=null&&el&&!el.closest('.gin')&&!el.closest('[data-act]')&&UI.peekSel){UI.peekSel=null;hideHl();const info=$('info');if(info)info.innerHTML=idleText()}
  if(!el||!(el.closest('.gin')||el.closest('.tray'))||el.closest('[data-act]'))return;e.preventDefault();
  /* the touched element may be redrawn away mid-gesture, so listen on it directly (events keep going to it) */
  const tg=e.target,off=()=>{tg.removeEventListener('touchmove',tMove);tg.removeEventListener('touchend',tEnd);tg.removeEventListener('touchcancel',tCancel)};T.off&&T.off();T.off=off;
  tg.addEventListener('touchmove',tMove,{passive:false});tg.addEventListener('touchend',tEnd,{passive:false});tg.addEventListener('touchcancel',tCancel);
  Object.assign(T,{x0:p.clientX,y0:p.clientY,moved:false,lp:false,drag:false,trail:[[p.clientX,p.clientY,performance.now()]],fromCurb:false});moveHeldTo(p.clientX,p.clientY);clearTimeout(T.timer);
  const c=cellAt(fakeEv(p.clientX,p.clientY)),H=UI.held;T.other=false;
  if(H&&H.inPlace&&UI.peek==null&&!run.result){const tt=el.closest('[data-tray]'),mine=new Set(H.items.map(q=>String(q.it.uid)));
    T.other=tt?!mine.has(tt.dataset.tray):!!(c&&occ(c.g)[c.cy*c.g.cols+c.cx])}
  if(!UI.held&&UI.peek==null&&!run.result&&c&&c.name==='pack'&&occ(c.g)[c.cy*c.g.cols+c.cx])
    T.timer=setTimeout(()=>{if(T.moved||T.x0==null)return;T.lp=true;onDown(fakeEv(T.x0,T.y0,true));try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}},430)},{passive:false});
function tMove(e){if(T.x0==null)return;e.preventDefault();const p=e.touches[0],x=p.clientX,y=p.clientY;
  if(!T.moved&&Math.hypot(x-T.x0,y-T.y0)>9){T.moved=true;clearTimeout(T.timer);
    if(UI.peek==null&&!run.result){if(T.other&&UI.held){dropHeld();render()}const had=!!UI.held;if(!UI.held&&!T.lp){onDown(fakeEv(T.x0,T.y0));T.fromCurb=!!UI.held&&UI.held.from==='curb'&&UI.held.items.length===1}if(UI.held){T.drag=true;if(UI.held.inPlace){UI.held.inPlace=false;render()}}if(had)T.fromCurb=UI.held.from==='curb'&&UI.held.items.length===1}}
  T.trail.push([x,y,performance.now()]);if(T.trail.length>8)T.trail.shift();
  moveHeldTo(x,y);const f=fakeEv(x,y);lastMove=f;hover(f)}
function tEnd(e){lastTouchT=performance.now();if(T.x0==null)return;e.preventDefault();T.off&&T.off();T.off=null;clearTimeout(T.timer);const p=e.changedTouches[0],f=fakeEv(p.clientX,p.clientY);lastMove=f;
  if(T.drag&&T.fromCurb&&UI.held&&isFlick(p.clientX,p.clientY))flickToBoard();
  else if(T.drag){if(UI.held)dragDrop(f)}else if(!T.moved&&!T.lp)tap(f);T.x0=null}
/* a dragged piece always ends up somewhere real: on the square under the finger, swapped with the piece there, or on the nearest spot it fits */
function dragDrop(f){const h=UI.held,c=cellAt(f);
  if(PORTRAIT&&(trayTile(f)||onTray(f))){heldToTray();sfx(500,.05);render();return}
  if(c){const nx=c.cx-h.gx,ny=c.cy-h.gy;
    if(placeGroup(c.g,h,nx,ny,true)){UI.held=null;sfx(500,.05);render();return}
    const o=h.items.length===1&&swapWith(c.g,h,nx,ny);
    if(o){const q=h.items[0],it=q.it,home=UI.grids[h.from];c.g.items.splice(c.g.items.indexOf(o),1);it.x=nx;it.y=ny;c.g.items.push(it);UI.held=null;
      /* the other piece takes the dragged piece's old spot */
      if(fits(home,o,q.ox,q.oy)){o.x=q.ox;o.y=q.oy;home.items.push(o)}
      else{UI.held={items:[{it:o,dx:0,dy:0,ox:o.x,oy:o.y,orot:o.rot||0}],from:c.name,gx:0,gy:0};snapNearest(f)}
      sfx(560,.05);render();return}}
  snapNearest(f);render()}
function snapNearest(f){const h=UI.held;if(!h)return;let best=null;
  for(const name of['pack','curb']){const g=UI.grids[name],gin=document.querySelector('.gin[data-g='+name+']');if(!g||!gin)continue;const r=gin.getBoundingClientRect();
    for(let y=-3;y<g.rows+3;y++)for(let x=-3;x<g.cols+3;x++){if(!placeGroup(g,h,x,y,false))continue;
      const cz=csFor(name),d=Math.hypot(r.left+(x+h.gx+.5)*cz-f.clientX,r.top+(y+h.gy+.5)*cz-f.clientY);if(!best||d<best.d)best={d,g,x,y}}}
  const tr=PORTRAIT&&document.querySelector('.tray');if(tr){const r=tr.getBoundingClientRect(),dx=Math.max(r.left-f.clientX,0,f.clientX-r.right),dy=Math.max(r.top-f.clientY,0,f.clientY-r.bottom),d=Math.hypot(dx,dy);
    if(!best||d<best.d){heldToTray();sfx(500,.05);return}}
  if(best&&placeGroup(best.g,h,best.x,best.y,true)){UI.held=null;sfx(500,.05)}else dropHeld()}
/* a fast flick of a level piece, in any direction, sends it to the first free spot on the board (like Shift-click) */
function isFlick(x,y){const now=performance.now(),tr=T.trail.filter(q=>now-q[2]<120);if(!tr.length)return false;const a=tr[0],dt=Math.max(16,now-a[2]),d=Math.hypot(x-a[0],y-a[1]);return d/dt>0.6&&d>30}
function flickToBoard(){const h=UI.held,it=h.items[0].it;UI.held=null;if(toPack(it)){sfx(520,.06);sfx(780,.08)}else{UI.held=h;dropHeld();toast('No room on the board')}render()}
function tCancel(){clearTimeout(T.timer);T.x0=null;T.off&&T.off();T.off=null}
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((k===' '||k==='enter')&&UI.beat&&UI.mode==='run'){e.preventDefault();if(!e.repeat){UI.beat=null;nextLevel()}return}
  if(k===' '&&UI.mode==='run'&&run&&run.endless&&!run.result&&!run.loading&&!UI.settings&&UI.peek==null&&!run.adv){e.preventDefault();if(!e.repeat)commitEndless();return}
  if(k==='r')rotateHeld();else if(k==='escape'){if(UI.peek!=null){UI.peek=null;render()}else if(UI.held&&run){dropHeld();render()}}});
addEventListener('mousemove',e=>{if(performance.now()-lastTouchT<900)return;mouse.x=e.clientX;mouse.y=e.clientY;lastMove=e;if(UI.held){const h=$('held');h.style.left=(e.clientX-(UI.held.gx+.5)*UI.cs)+'px';h.style.top=(e.clientY-(UI.held.gy+.5)*UI.cs)+'px'}hover(e)});
addEventListener('resize',()=>{if(UI.mode==='run')render();else renderRoutes()});
applyTheme();if(savedRun())resumeRun();else renderRoutes();
window.__game={get run(){return run},get UI(){return UI},PROG,commit,startRun,genAll};
